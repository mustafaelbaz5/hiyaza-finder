name: hiyaza_finder
description: "A new Flutter project."
publish_to: "none"
version: 1.0.9+9

# ----------------------------------------------------------------
# ENVIRONMENT
# ----------------------------------------------------------------
environment:
  sdk: ">=3.0.0 <4.0.0"

# ----------------------------------------------------------------
# DEPENDENCIES
# ----------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter

  # --- Supabase ---
  supabase_flutter: ^2.16.0

  # --- State Management ---
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0

  # --- Networking ---
  dio: ^5.10.0

  # --- Storage & Preferences ---
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

  # --- Dependency Injection ---
  get_it: ^9.2.1

  # --- Localization ---
  easy_localization: ^3.0.8

  # --- UI & Design ---
  cupertino_icons: ^1.0.9
  google_fonts: ^8.1.0
  flutter_screenutil: ^5.9.3
  flutter_native_splash: ^2.4.4
  flutter_animate: ^4.5.2

  # --- Utilities ---
  rename: ^3.1.0
  internet_connection_checker: ^3.0.1
  equatable: ^2.1.0
  url_launcher: ^6.3.2
  flutter_svg: ^2.2.4
  uuid: ^4.5.1

  # --- Voice Search (Android only) ---
  speech_to_text: ^7.4.0
  permission_handler: ^12.0.3
  flutter_dotenv: ^6.0.1

# ----------------------------------------------------------------
# DEV DEPENDENCIES
# ----------------------------------------------------------------
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.0
  mockito: ^5.6.4
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

# ----------------------------------------------------------------
# FLUTTER SETTINGS
# ----------------------------------------------------------------
flutter:
  uses-material-design: true

  # --- Assets ---
  assets:
    - assets/images/
    - assets/svgs/
    - assets/lang/
    - .env
  # --- Fonts ---
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/manrope/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/manrope/Manrope-ExtraBold.ttf
          weight: 800

    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/tajawal/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/tajawal/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/tajawal/Tajawal-Black.ttf
          weight: 900

# ----------------------------------------------------------------
# APP ICON
# ----------------------------------------------------------------
flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_Logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_Logo.png"
